<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Logic Master - Neon Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&family=Teko:wght@500;700&display=swap');
        
        body { margin: 0; overflow: hidden; background-color: #1a1a24; font-family: 'Kanit', sans-serif; touch-action: none; user-select: none; }
        
        /* Video Background */
        #video-bg { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); opacity: 0.4; }
        
        /* Neon UI Elements */
        .neon-border-p1 { border: 2px solid #00f3ff; box-shadow: 0 0 15px rgba(0,243,255,0.4), inset 0 0 15px rgba(0,243,255,0.2); }
        .neon-border-p2 { border: 2px solid #ff00ea; box-shadow: 0 0 15px rgba(255,0,234,0.4), inset 0 0 15px rgba(255,0,234,0.2); }
        
        .score-text-p1 { font-family: 'Teko', sans-serif; color: #00f3ff; text-shadow: 0 0 10px #00f3ff; }
        .score-text-p2 { font-family: 'Teko', sans-serif; color: #ff00ea; text-shadow: 0 0 10px #ff00ea; }
        
        /* Crystals */
        .crystal {
            width: 80px; height: 80px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem; font-weight: 800; color: white; position: relative; z-index: 10;
            transition: transform 0.1s;
        }
        .crystal::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); z-index: -1;
        }
        .crystal-t-p1 { background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe); box-shadow: 0 0 20px #00f2fe; }
        .crystal-f-p1 { background: radial-gradient(circle at 30% 30%, #ff416c, #ff4b2b); box-shadow: 0 0 20px #ff4b2b; }
        .crystal-t-p2 { background: radial-gradient(circle at 30% 30%, #b224ef, #7579ff); box-shadow: 0 0 20px #b224ef; }
        .crystal-f-p2 { background: radial-gradient(circle at 30% 30%, #f7971e, #ffd200); box-shadow: 0 0 20px #f7971e; }
        
        /* Charge Rings */
        .charge-ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border-radius: 50%; border: 4px solid transparent; width: 120px; height: 120px;
            opacity: 0; pointer-events: none; transition: opacity 0.1s;
        }
        
        .timer-glow { box-shadow: 0 0 15px #fde047; }
        
        /* Pop Animations */
        @keyframes popOut { 0% { transform: scale(1); } 50% { transform: scale(1.5); } 100% { transform: scale(1); } }
        .animate-pop { animation: popOut 0.3s ease-out; }
        
        /* Overlays */
        #timeout-text { display: none; font-family: 'Teko', sans-serif; text-shadow: 0 0 20px #ff4b2b; }
        #motion-canvas { display: none; }
        
        .zone-container { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; z-index: 5; pointer-events: none; }
        .zone-half { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15vh; position: relative; }
    </style>
</head>
<body>

    <video id="video-bg" autoplay playsinline muted></video>
    <canvas id="motion-canvas" width="64" height="48"></canvas>

    <div id="game-ui" class="absolute inset-0 z-10 hidden flex flex-col">
        <div class="w-full flex justify-between items-start px-6 pt-8 pb-4 relative">
            <div class="neon-border-p1 bg-[#0f172a]/80 rounded-2xl px-6 py-2 flex flex-col items-center relative z-20">
                <span class="text-[#00f3ff] text-xs font-bold tracking-widest">PLAYER 1</span>
                <span id="score-p1" class="score-text-p1 text-6xl leading-none">0</span>
            </div>
            
            <div class="absolute left-1/2 transform -translate-x-1/2 top-12 w-1/3 h-3 bg-gray-800 rounded-full border border-gray-600 z-10 flex items-center">
                <div id="timer-bar" class="h-full bg-yellow-400 timer-glow w-full rounded-full transition-all duration-100 ease-linear"></div>
            </div>

            <div class="neon-border-p2 bg-[#0f172a]/80 rounded-2xl px-6 py-2 flex flex-col items-center relative z-20">
                <span class="text-[#ff00ea] text-xs font-bold tracking-widest">PLAYER 2</span>
                <span id="score-p2" class="score-text-p2 text-6xl leading-none">0</span>
            </div>
        </div>

        <div class="relative w-full flex-grow flex justify-center pointer-events-none">
            <div class="absolute left-10 top-10 border border-yellow-500 bg-gray-900/80 rounded-xl p-4 shadow-[0_0_15px_rgba(234,179,8,0.3)]">
                <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-yellow-500 text-black text-xs font-bold px-3 py-1 rounded-full whitespace-nowrap">
                    Level <span id="level-num">1</span>
                </div>
                <div class="text-gray-400 text-xs text-center mb-1">โจทย์ปัจจุบัน</div>
                <div id="question-text" class="text-4xl font-bold text-white tracking-widest">T → F</div>
            </div>
            <div id="timeout-text" class="absolute top-1/4 text-8xl font-bold text-orange-500 z-50 tracking-wider">TIME OUT!</div>
        </div>

        <div class="zone-container">
            <div class="zone-half border-r-2 border-[#00f3ff]/30 border-dashed" style="box-shadow: inset 50px 0 100px -50px rgba(0,243,255,0.1);">
                <div class="relative" id="zone-p1T">
                    <div class="crystal crystal-t-p1">T</div>
                    <div class="charge-ring" style="border-top-color: #00f2fe; border-right-color: #00f2fe;"></div>
                </div>
                <div class="relative" id="zone-p1F">
                    <div class="crystal crystal-f-p1">F</div>
                    <div class="charge-ring" style="border-bottom-color: #ff4b2b; border-left-color: #ff4b2b;"></div>
                </div>
            </div>
            
            <div class="zone-half" style="box-shadow: inset -50px 0 100px -50px rgba(255,0,234,0.1);">
                <div class="relative" id="zone-p2T">
                    <div class="crystal crystal-t-p2">T</div>
                    <div class="charge-ring" style="border-top-color: #b224ef; border-right-color: #b224ef;"></div>
                </div>
                <div class="relative" id="zone-p2F">
                    <div class="crystal crystal-f-p2">F</div>
                    <div class="charge-ring" style="border-bottom-color: #f7971e; border-left-color: #f7971e;"></div>
                </div>
            </div>
        </div>

        <div class="w-full flex justify-between px-10 pb-6 relative z-20 pointer-events-auto">
            <button class="flex flex-col items-center text-cyan-300 hover:text-white transition">
                <div class="border border-cyan-500 rounded-lg p-2 bg-slate-900/50 mb-1"><i class="fa-solid fa-robot"></i></div>
                <span class="text-xs">AI Tutor</span>
            </button>
            <div class="text-yellow-400 font-bold text-lg align-bottom flex items-end tracking-wider">ขยับมือไปมา (โบกมือ) ที่ลูกแก้วเพื่อตอบ!</div>
            <button onclick="flipCamera()" class="flex flex-col items-center text-pink-300 hover:text-white transition">
                <div class="border border-pink-500 rounded-lg p-2 bg-slate-900/50 mb-1"><i class="fa-solid fa-camera-rotate"></i></div>
                <span class="text-xs">Camera Rotate</span>
            </button>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="absolute inset-0 z-50 flex items-center justify-center bg-gray-900/95 backdrop-blur-sm pointer-events-auto">
        <div class="bg-gray-800 border-2 border-[#00f3ff] p-8 rounded-3xl max-w-sm w-full text-center shadow-[0_0_30px_rgba(0,243,255,0.3)]">
            <h1 class="text-4xl font-black text-white mb-2" style="font-family: 'Teko'">LOGIC MASTER</h1>
            <p class="text-gray-400 mb-6 text-sm">Neon AR Edition</p>
            <div class="text-left text-gray-300 text-sm space-y-2 mb-6 bg-gray-900 p-4 rounded-xl">
                <p><span class="text-cyan-400 font-bold">P1 (ซ้าย)</span> vs <span class="text-pink-400 font-bold">P2 (ขวา)</span></p>
                <p>📌 ใครถึง 10 คะแนนก่อน <b class="text-yellow-400">ชนะ!</b></p>
                <p>✅ ตอบถูก <b class="text-green-400">+1</b> | ❌ ตอบผิด <b class="text-red-400">-1</b></p>
                <p>✋ เอามือ <b class="text-yellow-400">ขยับไปมา (โบกมือ)</b> ที่ลูกแก้ว</p>
            </div>
            <button onclick="startGame()" class="w-full bg-gradient-to-r from-cyan-500 to-pink-500 text-white font-bold py-3 rounded-xl text-xl hover:scale-105 transition shadow-lg">
                เริ่มเกม
            </button>
        </div>
    </div>

    <div id="winner-screen" class="absolute inset-0 z-50 hidden items-center justify-center bg-black/90 backdrop-blur-md pointer-events-auto">
        <div class="text-center">
            <h2 class="text-3xl text-white mb-2">WINNER!</h2>
            <h1 id="winner-text" class="text-7xl font-black mb-8" style="font-family: 'Teko'">PLAYER 1</h1>
            <button onclick="resetGame()" class="bg-white text-black font-bold py-3 px-8 rounded-full text-xl hover:scale-105 transition">
                Play Again
            </button>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function playSound(type) {
            if(!audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if(type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if(type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if(type === 'tick') {
                osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        let p1Score = 0, p2Score = 0;
        let level = 1;
        let timeLeft = 100;
        let gameActive = false;
        let facingMode = 'user';
        let energies = { p1T: 0, p1F: 0, p2T: 0, p2F: 0 };
        let chargeThresh = 25; 
        
        const questions = [
            { q: "T ∧ T", a: true }, { q: "T ∧ F", a: false }, { q: "F ∨ T", a: true }, { q: "F ∨ F", a: false },
            { q: "T → F", a: false }, { q: "F → T", a: true }, { q: "F → F", a: true }, { q: "T ↔ T", a: true },
            { q: "~(T ∧ F)", a: true }
        ];
        let currentQ = null;

        const video = document.getElementById('video-bg');
        const motionCanvas = document.getElementById('motion-canvas');
        const motionCtx = motionCanvas.getContext('2d', { willReadFrequently: true });
        let prevImg = null;
        let stream = null;

        async function initCamera() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode, width: 320, height: 240 } });
                video.srcObject = stream;
                video.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
            } catch(e) { alert("กรุณาอนุญาตให้ใช้งานกล้องครับ (Please allow camera access)"); }
        }

        function flipCamera() {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            initCamera();
        }

        function processMotion() {
            if(!gameActive || !video.videoWidth) return;
            
            motionCtx.drawImage(video, 0, 0, 64, 48);
            const currImg = motionCtx.getImageData(0, 0, 64, 48);
            
            if(prevImg) {
                let hits = { p1T: 0, p1F: 0, p2T: 0, p2F: 0 };
                
                for(let y=0; y<48; y+=2) {
                    for(let x=0; x<64; x+=2) {
                        const i = (y*64 + x)*4;
                        const diff = Math.abs(currImg.data[i]-prevImg.data[i]) + Math.abs(currImg.data[i+1]-prevImg.data[i+1]) + Math.abs(currImg.data[i+2]-prevImg.data[i+2]);
                        
                        // ลดเกณฑ์ลงเพื่อให้กล้องจับการขยับง่ายขึ้น
                        if(diff > 35) { 
                            let mapX = x/64; let mapY = y/48;
                            if(facingMode === 'user') mapX = 1 - mapX;
                            
                            if(mapX < 0.5 && mapY < 0.5) hits.p1T++;
                            else if(mapX < 0.5 && mapY >= 0.5) hits.p1F++;
                            else if(mapX >= 0.5 && mapY < 0.5) hits.p2T++;
                            else if(mapX >= 0.5 && mapY >= 0.5) hits.p2F++;
                        }
                    }
                }

                Object.keys(hits).forEach(k => {
                    const zone = document.getElementById(`zone-${k}`);
                    const ring = zone.querySelector('.charge-ring');
                    const crystal = zone.querySelector('.crystal');
                    
                    if(hits[k] > 2) {
                        // ปรับให้พลังงานขึ้นไวขึ้น
                        energies[k] += 1.5; 
                        ring.style.opacity = '1';
                        ring.style.transform = `translate(-50%, -50%) scale(${1 + (energies[k]/chargeThresh)*0.2}) rotate(${energies[k]*10}deg)`;
                        crystal.style.transform = `scale(1.1)`;
                        
                        if(Math.floor(energies[k]) % 5 === 0) playSound('tick');
                        
                        if(energies[k] >= chargeThresh) {
                            handleAnswer(k);
                            resetEnergies();
                        }
                    } else {
                        // ปรับให้พลังงานลดช้าลง เวลาหยุดขยับมือจะได้ไม่รีเซ็ตทันที
                        energies[k] = Math.max(0, energies[k]-0.3);
                        if(energies[k] === 0) {
                            ring.style.opacity = '0';
                            crystal.style.transform = `scale(1)`;
                        }
                    }
                });
            }
            prevImg = currImg;
        }

        function resetEnergies() {
            energies = { p1T: 0, p1F: 0, p2T: 0, p2F: 0 };
            document.querySelectorAll('.charge-ring').forEach(r => r.style.opacity = '0');
            document.querySelectorAll('.crystal').forEach(c => c.style.transform = 'scale(1)');
        }

        function startGame() {
            if(!audioCtx) {
                audioCtx = new AudioContext();
            }
            if(audioCtx.state === 'suspended') audioCtx.resume();

            // Unlock Audio สำหรับ iOS/มือถือ ด้วยการสร้างเสียงเงียบ 1 ครั้ง
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0; 
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(0);
            osc.stop(audioCtx.currentTime + 0.1);
            
            document.getElementById('start-menu').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            initCamera();
            resetGame();
            gameLoop();
        }

        function resetGame() {
            p1Score = 0; p2Score = 0; level = 1;
            document.getElementById('winner-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            updateUI();
            nextQuestion();
            gameActive = true;
        }

        function nextQuestion() {
            currentQ = questions[Math.floor(Math.random() * questions.length)];
            document.getElementById('question-text').innerText = currentQ.q;
            document.getElementById('level-num').innerText = level;
            timeLeft = 100;
            document.getElementById('timeout-text').style.display = 'none';
            resetEnergies();
        }

        function handleAnswer(zoneKey) {
            if(!gameActive) return;
            const player = zoneKey.substring(0, 2);
            const ansStr = zoneKey.substring(2);
            const isCorrect = (ansStr === 'T') === currentQ.a;

            if(isCorrect) {
                playSound('correct');
                if(player === 'p1') p1Score++; else p2Score++;
                
                const scoreEl = document.getElementById(`score-${player}`);
                scoreEl.classList.add('animate-pop', 'text-green-400');
                setTimeout(() => scoreEl.classList.remove('animate-pop', 'text-green-400'), 300);
            } else {
                playSound('wrong');
                if(player === 'p1') p1Score = Math.max(0, p1Score-1); else p2Score = Math.max(0, p2Score-1);
                
                const scoreEl = document.getElementById(`score-${player}`);
                scoreEl.classList.add('animate-pop', 'text-red-500');
                setTimeout(() => scoreEl.classList.remove('animate-pop', 'text-red-500'), 300);
            }

            updateUI();
            checkWin();
            if(gameActive) nextQuestion();
        }

        function updateUI() {
            document.getElementById('score-p1').innerText = p1Score;
            document.getElementById('score-p2').innerText = p2Score;
            level = Math.floor(Math.max(p1Score, p2Score) / 3) + 1;
        }

        function checkWin() {
            if(p1Score >= 10 || p2Score >= 10) {
                gameActive = false;
                document.getElementById('game-ui').classList.add('hidden');
                const winScreen = document.getElementById('winner-screen');
                const winText = document.getElementById('winner-text');
                
                winScreen.classList.remove('hidden');
                winScreen.classList.add('flex');
                
                if(p1Score >= 10) {
                    winText.innerText = "PLAYER 1";
                    winText.className = "text-7xl font-black mb-8 text-[#00f3ff]";
                } else {
                    winText.innerText = "PLAYER 2";
                    winText.className = "text-7xl font-black mb-8 text-[#ff00ea]";
                }
            }
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            if(!lastTime) lastTime = timestamp;
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            if(gameActive) {
                timeLeft -= (0.05 + (level*0.01)) * (dt/16);
                
                const timerBar = document.getElementById('timer-bar');
                timerBar.style.width = Math.max(0, timeLeft) + '%';
                
                if(timeLeft < 30) timerBar.className = "h-full bg-red-500 timer-glow w-full rounded-full";
                else timerBar.className = "h-full bg-yellow-400 timer-glow w-full rounded-full";

                if(timeLeft <= 0) {
                    playSound('wrong');
                    document.getElementById('timeout-text').style.display = 'block';
                    gameActive = false;
                    setTimeout(() => {
                        if(p1Score < 10 && p2Score < 10) {
                            gameActive = true;
                            nextQuestion();
                        }
                    }, 1000);
                }

                processMotion();
            // เพิ่มตัวแปรกันการตอบเบิ้ล
let isCooldown = false;

function processMotion() {
    // ถ้าเกมหยุด หรืออยู่ในช่วงคูลดาวน์ จะไม่รับค่าเซนเซอร์
    if(!gameActive || !video.videoWidth || isCooldown) return;
    
    motionCtx.drawImage(video, 0, 0, 64, 48);
    const currImg = motionCtx.getImageData(0, 0, 64, 48);
    
    if(prevImg) {
        let hits = { p1T: 0, p1F: 0, p2T: 0, p2F: 0 };
        
        for(let y=0; y<48; y+=2) {
            for(let x=0; x<64; x+=2) {
                const i = (y*64 + x)*4;
                const diff = Math.abs(currImg.data[i]-prevImg.data[i]) + 
                             Math.abs(currImg.data[i+1]-prevImg.data[i+1]) + 
                             Math.abs(currImg.data[i+2]-prevImg.data[i+2]);
                
                if(diff > 30) { 
                    let mapX = x/64; let mapY = y/48;
                    if(facingMode === 'user') mapX = 1 - mapX;
                    
                    if(mapX < 0.5 && mapY < 0.5) hits.p1T++;
                    else if(mapX < 0.5 && mapY >= 0.5) hits.p1F++;
                    else if(mapX >= 0.5 && mapY < 0.5) hits.p2T++;
                    else if(mapX >= 0.5 && mapY >= 0.5) hits.p2F++;
                }
            }
        }

        // ระบบใหม่: ตรวจเจอการขยับแค่ระดับ 4 (ปัดมือผ่านเบาๆ) ก็ส่งคำตอบทันที
        for (let k of Object.keys(hits)) {
            if(hits[k] > 4) { 
                const zone = document.getElementById(`zone-${k}`);
                const crystal = zone.querySelector('.crystal');
                
                // เอฟเฟกต์ลูกแก้วเด้งขยายตัวตอนโดนปัด
                crystal.style.transform = `scale(1.5)`;
                setTimeout(() => crystal.style.transform = `scale(1)`, 200);
                
                // ส่งคำตอบ
                handleAnswer(k);
                
                // เปิดคูลดาวน์ 0.8 วินาที ป้องกันการปัดครั้งเดียวแต่นับคะแนนเบิ้ลรัวๆ
                isCooldown = true;
                setTimeout(() => { isCooldown = false; }, 800);
                
                // บังคับหยุด loop ทันที เพื่อให้รับคำตอบเดียวในเสี้ยววินาทีนั้น
                break; 
            }
        }
    }
    prevImg = currImg;
}
